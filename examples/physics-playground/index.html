<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics playground — @sigx/three-rapier</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e14; color: #e6e6e6; font-family: system-ui, sans-serif; overflow: hidden; }
      #app { height: 100%; position: relative; }
      .hud { position: absolute; inset: 0 0 auto 0; display: flex; gap: 0.75rem; align-items: center; padding: 0.75rem 1rem; pointer-events: none; font-variant-numeric: tabular-nums; }
      .hud strong { color: #7dd3fc; }
      .hud button { pointer-events: auto; font: inherit; padding: 0.35rem 0.75rem; border: 1px solid #3a4152; background: #1c2230cc; color: inherit; border-radius: 6px; cursor: pointer; }
      .hud .right { margin-left: auto; opacity: 0.75; }
      .help { position: absolute; left: 1rem; bottom: 1rem; opacity: 0.6; font-size: 0.85rem; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
