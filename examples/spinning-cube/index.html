<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinning cube — @sigx/three</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e14; color: #e6e6e6; font-family: system-ui, sans-serif; }
      #app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; gap: 1rem; align-items: center; padding: 0.75rem 1rem; background: #131722; }
      header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
      button { font: inherit; padding: 0.4rem 0.8rem; border: 1px solid #3a4152; background: #1c2230; color: inherit; border-radius: 6px; cursor: pointer; }
      button:hover { background: #262e40; }
      .fps { margin-left: auto; opacity: 0.7; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
