packages:
  - packages/*
  - examples/*

# Single source of truth for the SignalX core version this repo consumes.
# Every package references these as "catalog:", which pnpm rewrites to the
# range below on pack/publish. Core keeps reactive state in module-local
# variables, so exactly ONE physical copy must resolve — the ^1.0.0
# (>=1.0.0 <2.0.0) single-major range forces pnpm to hoist one copy
# (on 1.x a caret admits additive minors; on 0.x it was a single minor).
# `pnpm sync:core` rewrites these pins and this comment together.
catalog:
  '@sigx/reactivity': ^1.0.1
  '@sigx/runtime-core': ^1.0.1
  '@sigx/runtime-dom': ^1.0.1
  '@sigx/vite': ^1.0.1
  sigx: ^1.0.1

onlyBuiltDependencies:
  - esbuild
